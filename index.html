<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRO Roofing</title>
<meta name="robots" content="noindex">

<!-- Not a page. GitHub Pages serves this repo from its root, and with no
     index.html here it renders README.md instead — which is what a shared link
     used to open. This sends the root straight through to the site.

     location.replace rather than href, so it leaves no history entry and the
     back button does not bounce the visitor back into the redirect. The meta
     refresh covers the case where script is off, and the link covers both. -->
<meta http-equiv="refresh" content="0; url=pro-roofing/">
<link rel="canonical" href="https://yah-enter.github.io/SAMP/pro-roofing/">
<script>location.replace("pro-roofing/");</script>

<style>
  html, body { margin: 0; height: 100%; background: #000; }
  a {
    display: block;
    padding: 28px 18px;
    color: #66BC45;
    font: 500 14px/1.5 "Space Grotesk", ui-monospace, monospace;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-decoration: none;
  }
</style>
</head>
<body>
  <a href="pro-roofing/">Continue to PRO Roofing &rarr;</a>
</body>
</html>
