<!-- This file has to exist. GitHub Pages serves this repo from its root, and

     instead, which publishes the readme to anyone with the link.

     further notice, so the redirect would now land on a 404; this holding page
     stands in its place. Deliberately unbranded and noindex: it names no client
     and claims nothing. -->

  body { display: grid; place-items: center; }
  p {
    margin: 0;
